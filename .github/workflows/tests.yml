on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build (${{ matrix.tts }})
    strategy:
      matrix:
        tts: [espeak, espeak-ng, speech-dispatcher]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autopoint \
            doxygen \
            lcov \
            libcunit1-dev \
            libespeak-dev \
            libespeak-ng-dev \
            libpng-dev \
            librsvg2-dev \
            libsdl1.2-dev \
            libsdl-image1.2-dev \
            libsdl-mixer1.2-dev \
            libsdl-net1.2-dev \
            libsdl-pango-dev \
            libspeechd-dev \
            libxml2-dev

      - name: Build library (with coverage instrumentation)
        run: |
          autoreconf -i
          ./configure \
            --without-espeak \
            --without-espeak-ng \
            --without-speech-dispatcher \
            --with-${{ matrix.tts }} \
            CFLAGS="-g -O0 --coverage" \
            LDFLAGS="--coverage"
          make

      - name: Build and run unit tests
        run: |
          cd src/tests
          make CUNITINC=/usr/include \
               CUNITLIB=/usr/lib/x86_64-linux-gnu \
               T4KCOMMONINC=.. \
               CFLAGS="-g -O0 --coverage" \
               LIBS="-L../../.libs -lt4k_common -lcunit $(pkg-config --libs sdl SDL_ttf) --coverage" \
               INC="-I/usr/include $(pkg-config --cflags sdl) -I.."
          LD_LIBRARY_PATH=../../.libs ./unittest

      - name: Generate coverage report
        run: |
          # Capture coverage data from all instrumented sources
          lcov --capture --directory . --output-file coverage_all.info
          # Strip system headers and bundled gnulib from the report;
          # keep only the library's own sources (src/t4k_*.c)
          lcov --remove coverage_all.info \
               '/usr/*' \
               '*/gnulib/*' \
               '*/tests/main.c' \
               '*/tests/test_public_functions.c' \
               --output-file coverage.info
          # Print summary — advisory only, never blocks the build
          lcov --summary coverage.info || true

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.tts }}
          path: coverage.info
          if-no-files-found: warn
