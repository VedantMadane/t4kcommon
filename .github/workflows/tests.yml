on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build
    strategy:
      matrix:
        tts: [espeak, espeak-ng, speech-dispatcher]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autopoint \
            doxygen \
            libcunit1-dev \
            libespeak-dev \
            libespeak-ng-dev \
            libpng-dev \
            librsvg2-dev \
            libsdl1.2-dev \
            libsdl-image1.2-dev \
            libsdl-mixer1.2-dev \
            libsdl-net1.2-dev \
            libsdl-pango-dev \
            libsdl-ttf2.0-dev \
            libspeechd-dev \
            libxml2-dev

      - name: Build and install library
        run: |
          autoreconf -i
          ./configure \
            --without-espeak \
            --without-espeak-ng \
            --without-speech-dispatcher \
            --with-${{ matrix.tts }}
          make
          sudo make install
          sudo ldconfig

      - name: Build and run unit tests
        run: |
          cd src/tests
          make CUNITINC=/usr/include \
               CUNITLIB=/usr/lib/x86_64-linux-gnu \
               T4KCOMMONINC=.. \
               LIBS="-lt4k_common -lcunit $(pkg-config --libs sdl SDL_ttf)" \
               INC="-I/usr/include $(pkg-config --cflags sdl) -I.."
          ./unittest
